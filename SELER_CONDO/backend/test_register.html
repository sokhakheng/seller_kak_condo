<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELER_CONDO - Register Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">

    <div class="bg-white max-w-md w-full rounded-2xl shadow-xl overflow-hidden border border-slate-100">
        
        <div class="bg-emerald-600 p-6 text-center">
            <h1 class="text-2xl font-bold text-white tracking-wider">SELER_CONDO</h1>
            <p class="text-emerald-200 mt-1 text-sm">Create New Account Test</p>
        </div>

        <div class="p-8">
            <form id="registerForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Full Name</label>
                    <input type="text" id="name" placeholder="e.g. Jane Smith" required
                        class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Email Address</label>
                    <input type="email" id="email" placeholder="jane@example.com" required
                        class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Password</label>
                    <input type="password" id="password" placeholder="Create a password" required
                        class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Account Type</label>
                    <select id="role" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <option value="buyer">I want to buy a condo (Buyer)</option>
                        <option value="seller">I want to sell condos (Seller)</option>
                    </select>
                </div>

                <button type="submit"
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg transition-colors shadow-sm mt-4">
                    Create User in Database
                </button>
            </form>

            <div id="statusMessage" class="hidden mt-6 p-4 rounded-lg text-sm text-center font-medium border">
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            
            const statusBox = document.getElementById('statusMessage');

            statusBox.className = "mt-6 p-4 rounded-lg text-sm text-center font-medium border bg-blue-50 text-blue-700 border-blue-200";
            statusBox.textContent = "Sending data to server...";
            statusBox.classList.remove('hidden');

            try {
                // Notice we are sending this to /api/register now!
                const response = await fetch('http://localhost:5000/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, role })
                });

                const data = await response.json();

                if (data.success) {
                    statusBox.className = "mt-6 p-4 rounded-lg text-sm text-center font-medium border bg-emerald-50 text-emerald-700 border-emerald-200";
                    statusBox.textContent = "✅ " + data.message;
                    document.getElementById('registerForm').reset(); // Clear the form on success
                } else {
                    statusBox.className = "mt-6 p-4 rounded-lg text-sm text-center font-medium border bg-red-50 text-red-700 border-red-200";
                    statusBox.textContent = "❌ " + data.message;
                }
            } catch (error) {
                statusBox.className = "mt-6 p-4 rounded-lg text-sm text-center font-medium border bg-red-50 text-red-700 border-red-200";
                statusBox.textContent = "❌ Could not connect to the server.";
            }
        });
    </script>
</body>
</html>
