<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELER_CONDO - Login Test</title>
    <!-- Load Tailwind CSS directly for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">

    <!-- Login Card Container -->
    <div class="bg-white max-w-md w-full rounded-2xl shadow-xl overflow-hidden border border-slate-100">
        
        <!-- Header Section -->
        <div class="bg-indigo-600 p-6 text-center">
            <h1 class="text-2xl font-bold text-white tracking-wider">SELER_CONDO</h1>
            <p class="text-indigo-200 mt-1 text-sm">Database Connection Test</p>
        </div>

        <div class="p-8">
            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Email Address</label>
                    <!-- Pre-filled with a fake user email -->
                    <input type="email" id="email" value="john@example.com" required
                        class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Password</label>
                    <!-- Pre-filled with a fake password -->
                    <input type="password" id="password" value="123456" required
                        class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                </div>

                <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition-colors shadow-sm mt-2">
                    Test Database Login
                </button>
            </form>

            <!-- Status Message Box (Hidden by default) -->
            <div id="statusMessage" class="hidden mt-6 p-4 rounded-lg text-sm text-center font-medium border">
            </div>
        </div>
    </div>

    <script>
        // Listen for the form submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Stop the page from reloading
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const statusBox = document.getElementById('statusMessage');

            // Show "Testing..." message
            statusBox.className = "mt-6 p-4 rounded-lg text-sm text-center font-medium border bg-blue-50 text-blue-700 border-blue-200";
            statusBox.textContent = "Testing connection to server...";
            statusBox.classList.remove('hidden');

            try {
                // Send the data to your Node.js backend
                const response = await fetch('http://localhost:5000/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                // If the server says 'success: true'
                if (data.success) {
                    statusBox.className = "mt-6 p-4 rounded-lg text-sm text-center font-medium border bg-emerald-50 text-emerald-700 border-emerald-200";
                    statusBox.textContent = "✅ " + data.message;
                } else {
                    // If the server says 'success: false' (e.g., wrong password)
                    statusBox.className = "mt-6 p-4 rounded-lg text-sm text-center font-medium border bg-red-50 text-red-700 border-red-200";
                    statusBox.textContent = "❌ " + data.message;
                }
            } catch (error) {
                // If the server is not running or throws a big error
                statusBox.className = "mt-6 p-4 rounded-lg text-sm text-center font-medium border bg-red-50 text-red-700 border-red-200";
                statusBox.textContent = "❌ Could not connect to the server. Is Node running?";
                console.error("Error details:", error);
            }
        });
    </script>
</body>
</html>
